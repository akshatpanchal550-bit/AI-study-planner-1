<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Smart AI Study Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/register.css?v=2">

    <link rel="stylesheet" href="./assets/css/workspace.css?v=2">

</head>

<body class="auth-page">

<section class="register-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-12 register-column">

                <div class="register-card shadow-lg">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-user-plus register-icon"></i>

                        <h2>Create Account</h2>

                        <p class="text-muted">
                            Join Smart AI Study Planner
                        </p>

                    </div>

                    <form id="registerForm" novalidate>

                        <div class="register-form-status" id="registerStatus" role="alert" aria-live="polite"></div>

                        <div class="mb-3">

                            <label class="form-label" for="fullName">Full Name</label>

                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                autocomplete="name"
                                placeholder="Enter your name"
                                minlength="2"
                                maxlength="100"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label" for="email">Email</label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                autocomplete="email"
                                placeholder="Enter your email"
                                maxlength="254"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label" for="password">Password</label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    minlength="8"
                                    autocomplete="new-password"
                                    placeholder="Create password"
                                    required>

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="togglePassword"
                                    aria-label="Show password"
                                    aria-pressed="false">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label" for="confirmPassword">Confirm Password</label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                minlength="8"
                                autocomplete="new-password"
                                placeholder="Confirm password"
                                required>

                        </div>

                        <button
                            id="registerSubmit"
                            type="submit"
                            class="btn btn-primary w-100">

                            Register

                        </button>
                    </form>

                    <div class="text-center mt-4">

                        Already have an account?

                        <a href="login.html">

                            Login

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script src="./assets/js/auth.js"></script>
<script src="./assets/js/register.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
