<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17332c">
    <meta name="description" content="Sign in to your Smart AI Study Planner account.">
    <title>Sign In | Smart AI Study Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/workspace.css">
    <link rel="stylesheet" href="./assets/css/login.css?v=2">
</head>
<body class="auth-page login-page">
    <main class="login-section">
        <section class="login-card" aria-labelledby="loginTitle">
            <a class="login-brand" href="index.html" aria-label="Smart AI Study Planner home">
                <span class="login-brand-mark" aria-hidden="true"><i class="fa-solid fa-graduation-cap"></i></span>
                <span><strong>StudyPilot</strong><small>AI Study Planner</small></span>
            </a>

            <div class="login-heading">
                <span class="login-eyebrow">YOUR STUDY SPACE</span>
                <h1 id="loginTitle">Welcome back</h1>
                <p>Sign in to continue building your study rhythm.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="login-field">
                    <label class="form-label" for="loginEmail">Email address</label>
                    <input class="form-control" id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="loginEmailError" required>
                    <span class="invalid-feedback" id="loginEmailError" hidden></span>
                </div>

                <div class="login-field">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="input-group login-password-group">
                        <input class="form-control" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="loginPasswordError" required>
                        <button class="password-toggle" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">
                            <i class="fa-regular fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="invalid-feedback" id="loginPasswordError" hidden></span>
                </div>

                <div class="login-options">
                    <label class="form-check-label remember-option" for="remember">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a class="login-text-link" href="#forgotPasswordHelp" id="forgotPasswordLink" aria-controls="forgotPasswordHelp" aria-expanded="false">Forgot password?</a>
                </div>
                <p class="forgot-help" id="forgotPasswordHelp" role="status" hidden>Password recovery is not configured in this project yet. Contact your administrator for help.</p>

                <button class="btn btn-primary login-submit" id="loginSubmit" type="submit">
                    <span class="login-spinner spinner-border spinner-border-sm" aria-hidden="true" hidden></span>
                    <span data-submit-label>Sign in</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
                <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
            </form>

            <p class="register-prompt">New to StudyPilot? <a href="register.html">Create an account</a></p>
            <a class="back-home" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to home</a>
        </section>
    </main>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/login.js?v=3"></script>
</body>
</html>
